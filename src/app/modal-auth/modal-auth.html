<!-- Modal Bootstrap -->
<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow-lg border-0 rounded-4">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="authModalLabel">Bienvenue sur la plateforme CDWFS-IUC</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Connexion</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Inscription</button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- Connexion -->
          <div class="tab-pane fade show active" id="login" role="tabpanel">
            <form>
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
                <label for="loginEmail">Adresse e-mail</label>
              </div>
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="loginPassword" placeholder="Mot de passe" required>
                <label for="loginPassword">Mot de passe</label>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                  <input type="checkbox" id="rememberMe"> <label for="rememberMe" class="ms-1">Se souvenir de moi</label>
                </div>
                <a href="#" class="text-success text-decoration-none">Mot de passe oublié ?</a>
              </div>
              <button type="submit" class="btn btn-success w-100 py-2">Se connecter</button>
            </form>
          </div>

          <!-- Inscription -->
          <div class="tab-pane fade" id="register" role="tabpanel">
            <form>
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="regName" placeholder="Nom complet" required>
                <label for="regName">Nom complet</label>
              </div>
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                <label for="regEmail">Adresse e-mail</label>
              </div>
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="regPassword" placeholder="Mot de passe" required>
                <label for="regPassword">Mot de passe</label>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Créer un compte</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
